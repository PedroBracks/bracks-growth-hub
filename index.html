<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bracks Growth Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Bracks Growth Hub — central de gestão de crescimento comercial SalExpress.
   Paleta da marca: vermelho SAL, grafite/preto e branco. Regra de retorno: 7 dias úteis (configurável). */
:root{
  --sal:#ef1717; --sal-deep:#b40f0f; --sal-soft:#fde8e8;
  --ink:#111214; --graphite:#2a2b2e; --graphite-2:#3a3c41; --steel:#6b7280;
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f8f9fb; --line:#e3e6eb;
  --fg:#16181d; --fg-muted:#5f6672;
  --good:#15803d; --good-soft:#e7f6ec; --warn:#b7791f; --warn-soft:#fdf4e1; --bad:#dc2626; --bad-soft:#fdeaea; --info:#2563eb; --info-soft:#e8efff;
  --env:#fbfbfc; --env-edge:#d9dde3; --side:#111214; --side-fg:#eceef2; --side-muted:#8e949e; --side-hover:#1f2125;
  --font:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0f11; --surface:#17181c; --surface-2:#1d1f24; --line:#2b2e35; --fg:#f2f3f5; --fg-muted:#a4aab4;
    --sal-soft:#3a1212; --good-soft:#12261a; --warn-soft:#2e2410; --bad-soft:#3a1414; --info-soft:#14213a; --env:#1d1f24; --env-edge:#363a43;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0f11; --surface:#17181c; --surface-2:#1d1f24; --line:#2b2e35; --fg:#f2f3f5; --fg-muted:#a4aab4;
  --sal-soft:#3a1212; --good-soft:#12261a; --warn-soft:#2e2410; --bad-soft:#3a1414; --info-soft:#14213a; --env:#1d1f24; --env-edge:#363a43;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(22px,3vw,30px)}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sal);outline-offset:2px;border-radius:6px}
.muted{color:var(--fg-muted)}
.small{font-size:12.5px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-muted);font-weight:700}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 6px}
.logo{background:var(--sal);color:#fff;font-weight:900;font-style:italic;font-size:15px;padding:5px 9px;border-radius:4px;letter-spacing:.02em}
.brand b{display:block;font-size:15px;font-weight:800;line-height:1.15}
.brand span{display:block;font-size:11px;color:var(--side-muted);margin-top:3px;line-height:1.35}
.nav-title{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#6f7581;font-weight:800;padding:10px 10px 4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--side-fg);text-align:left;padding:9px 11px;border-radius:9px;opacity:.8;font-weight:500}
.nav button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--side-hover);opacity:1}
.nav button[aria-current="page"]{background:var(--side-hover);opacity:1;font-weight:700;box-shadow:inset 3px 0 0 var(--sal)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid #23262c;font-size:11.5px;color:var(--side-muted);line-height:1.45}
.side-foot button{width:100%;margin-top:8px;border:1px solid #3a3d44;background:none;color:var(--side-fg);border-radius:8px;padding:8px;font-weight:600}
.side-foot button:hover{border-color:var(--sal)}
.side-foot .primary-side{background:var(--sal);color:#fff;border-color:var(--sal)}
main{padding:28px clamp(16px,3vw,40px);min-width:0;max-width:1480px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.head .eyebrow{color:var(--sal);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.head p{color:var(--fg-muted);margin-top:4px}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h p{color:var(--fg-muted);font-size:12.5px;margin-top:2px}
.hero{background:linear-gradient(118deg,#0b0c0e 0%,#1d1f23 58%,#4a0d0d 100%);color:#fff;border:0;padding:24px 26px;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(239,23,23,.35),transparent 70%)}
.hero .eyebrow{color:#ff6b6b;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.hero h2{font-size:24px;margin:6px 0 4px}
.hero p{color:#c9ccd3;font-size:13.5px}
.hero > *{position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{cursor:pointer;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;transition:border-color .15s,transform .15s;border-top:3px solid var(--graphite)}
.kpi:hover{border-color:var(--sal);transform:translateY(-1px)}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--fg-muted);margin-top:2px}
.kpi.alert{border-top-color:var(--sal)}
.kpi.alert .v{color:var(--sal)}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;overflow-wrap:anywhere}
.rank{font-family:var(--mono);color:var(--fg-muted);width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:var(--surface-2);font-size:12px;flex:none}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.tag{display:inline-block;font-size:11px;background:var(--sal-soft);color:var(--sal-deep);padding:3px 9px;border-radius:6px;font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:9px;padding:8px 13px;font-weight:600;white-space:nowrap;transition:border-color .15s,transform .15s}
.btn:hover{border-color:var(--fg-muted);transform:translateY(-1px)}
.btn.primary{background:var(--sal);border-color:var(--sal);color:#fff}
.btn.primary:hover{background:var(--sal-deep);border-color:var(--sal-deep)}
.btn.dark{background:var(--graphite);border-color:var(--graphite);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--surface-2);color:var(--fg)}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--sal);outline-offset:0;border-color:transparent}
.toolbar .input{width:min(300px,100%)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:11px;font-weight:700;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.06em}
.field textarea{min-height:76px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
@media (max-width:620px){.form{grid-template-columns:1fr}}
.callout{padding:13px 15px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--graphite)}
.callout.sal{border-left-color:var(--sal);background:var(--sal-soft)}
.callout.good{border-left-color:var(--good);background:var(--good-soft)}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout b{display:block;margin-bottom:3px}
.empty{padding:26px;text-align:center;color:var(--fg-muted);border:1px dashed var(--line);border-radius:10px}
/* Pipeline / envelopes */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-muted);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:14px;height:8px;border-radius:3px;display:inline-block}
.board{display:grid;grid-template-columns:repeat(5,minmax(214px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:214px;display:flex;flex-direction:column;border-top:3px solid var(--graphite)}
.col-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col-head .count{font-family:var(--mono);font-size:12px;color:var(--fg-muted);background:var(--surface-2);border-radius:6px;padding:1px 7px}
.col-desc{font-size:12px;color:var(--fg-muted);margin:4px 0 4px;min-height:34px}
.env{position:relative;display:block;width:100%;text-align:left;background:var(--env);border:1px solid var(--env-edge);border-radius:9px;padding:11px 12px 10px;margin-top:14px;cursor:pointer;transition:transform .12s,box-shadow .12s;--slip:var(--good);min-width:0}
.env::before{content:"";position:absolute;left:14%;right:14%;top:-9px;height:10px;background:var(--slip);border-radius:4px 4px 0 0}
.env:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0002}
.env.yellow{--slip:var(--warn)}
.env.red{--slip:var(--bad)}
.env .nm{font-weight:700;display:block;overflow-wrap:anywhere}
.env .meta{font-size:12px;color:var(--fg-muted);display:block;margin-top:3px}
/* Tabela */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td.name{font-weight:700}
/* Perícia: acordeão de clientes */
.plist{display:flex;flex-direction:column;gap:10px}
.pitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;border-left:4px solid var(--warn);overflow:hidden}
.pitem.red{border-left-color:var(--bad)}
.pitem > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:14px;align-items:center;padding:14px 16px}
.pitem > summary::-webkit-details-marker{display:none}
.pitem > summary:hover{background:var(--surface-2)}
.pitem .pname{font-weight:700;font-size:15px}
.pitem .pstate{font-size:12.5px;color:var(--fg-muted);margin-top:2px}
.chev{width:9px;height:9px;border-right:2px solid var(--fg-muted);border-bottom:2px solid var(--fg-muted);transform:rotate(45deg);justify-self:center;transition:transform .15s;margin-top:-4px}
.pitem[open] .chev{transform:rotate(225deg);margin-top:4px}
.pbody{padding:4px 16px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:820px){.pbody{grid-template-columns:1fr}}
.block{background:var(--surface-2);border-radius:10px;padding:11px 13px;border:1px solid var(--line)}
.block b{display:block;font-size:11px;color:var(--sal-deep);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.block p{font-size:13px}
.hist-list{display:flex;flex-direction:column}
.hist-list div{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.hist-list div:last-child{border-bottom:0}
.hist-list .d{font-family:var(--mono);font-size:11.5px;color:var(--fg-muted);margin-right:8px}
/* Inteligência */
.perf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.6fr);gap:16px}
@media (max-width:980px){.perf{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.perf .wide{grid-column:1/-1}}
@media (max-width:620px){.perf{grid-template-columns:1fr}}
.ring{display:flex;justify-content:center}
.ring svg{width:150px;height:150px;max-width:100%}
.ring .track{fill:none;stroke:var(--line);stroke-width:12}
.ring .arc{fill:none;stroke:var(--sal);stroke-width:12;stroke-linecap:round}
.ring .val{font-family:var(--mono);font-size:26px;font-weight:600;fill:var(--fg)}
.ring .lab{font-size:10px;fill:var(--fg-muted);text-transform:uppercase;letter-spacing:.06em}
.hbar{display:flex;gap:3px;height:14px;margin:8px 0}
.hbar span{border-radius:4px;min-width:6px}
.dots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.dots li{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}
.dots i{width:12px;height:12px;border-radius:3px}
.dots .pc{font-family:var(--mono);font-weight:600;min-width:3.5ch;text-align:right}
.frow{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 92px;gap:12px;align-items:center;width:100%;background:none;border:0;padding:8px 6px;border-radius:9px;text-align:left;font-size:13px}
.frow:hover{background:var(--surface-2)}
.frow .ft{background:var(--line);border-radius:5px;height:12px;overflow:hidden}
.frow .ff{display:block;height:100%;background:var(--graphite);border-radius:5px;width:0;transition:width .8s ease}
.frow.won .ff{background:var(--sal)}
.frow .fv{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--sal);border-radius:9px}
/* Modelos */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--fg-muted)}
.chip[aria-pressed="true"]{background:var(--graphite);border-color:var(--graphite);color:#fff}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.model{display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--sal)}
.model .txt{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:13.5px;white-space:pre-wrap;line-height:1.55}
.model .when{font-size:12.5px;color:var(--fg-muted)}
.model .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
/* Configurações */
.cfg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.cfg-grid{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--fg-muted)}
.kv b{text-align:right}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch-row:last-child{border-bottom:0}
.legal p{font-size:13px;color:var(--fg-muted);margin-top:8px}
.legal details{border-bottom:1px solid var(--line);padding:11px 0}
.legal details:last-child{border-bottom:0}
.legal summary{cursor:pointer;font-weight:700;list-style:none}
.legal summary::-webkit-details-marker{display:none}
.legal summary::after{content:"+";float:right;color:var(--fg-muted)}
.legal details[open] summary::after{content:"−"}
/* Modal */
.modalbg{position:fixed;inset:0;background:rgba(10,11,13,.56);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;backdrop-filter:blur(4px)}
.modal{background:var(--surface);color:var(--fg);width:min(980px,100%);max-height:92vh;overflow:auto;border-radius:16px;border:1px solid var(--line);box-shadow:0 24px 70px #0009}
.mh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1;border-top:4px solid var(--sal);border-radius:16px 16px 0 0}
.mh .sub{font-size:12.5px;color:var(--fg-muted);margin-top:3px}
.mb{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.close{border:0;background:var(--surface-2);border-radius:8px;padding:6px 11px;color:var(--fg);font-weight:700}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}
@media (max-width:820px){.two-col{grid-template-columns:1fr}}
.kvm{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kvm span:first-child{color:var(--fg-muted)}
.kvm b{text-align:right;overflow-wrap:anywhere}
.warn-txt{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 10px 30px #0006}
.toast.on{opacity:1}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--sal)}100%{box-shadow:0 0 0 3px transparent}}
.flash{animation:flash 1.4s ease-out}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column;padding:14px 12px;gap:10px;overflow:visible}
  .nav{flex-direction:row;flex-wrap:wrap;gap:4px}
  .nav button{width:auto;padding:8px 10px;font-size:13px}
  .nav-title,.side-foot{display:none}
  main{padding:20px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">SAL</span><div><b>Bracks Growth Hub</b><span>Central de gestão de crescimento comercial</span></div></div>
    <div class="nav-title">Gestão</div>
    <nav class="nav" id="nav">
      <button data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Visão geral</button>
      <button data-v="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Minha agenda</button>
      <button data-v="pipeline"><svg viewBox="0 0 24 24"><path d="M3 5h5v14H3zM10 5h5v9h-5zM17 5h4v5h-4z"/></svg>Pipeline comercial</button>

}

/* ===================== Datas e regra de retorno ===================== */
const p2 = n => String(n).padStart(2,"0");
const dateStr = d => d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const TODAY = dateStr(new Date());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 12); };
const isBiz = d => d.getDay()!==0 && d.getDay()!==6 && !HOLIDAYS.includes(dateStr(d));
function addBiz(s, n){ const d = parseD(s); while(n>0){ d.setDate(d.getDate()+1); if(isBiz(d)) n--; } return dateStr(d); }
function bizBetween(a, b){
  let d = parseD(a), e = parseD(b), n = 0, sign = 1;
  if(d > e){ [d,e] = [e,d]; sign = -1; }
  while(d < e){ d.setDate(d.getDate()+1); if(isBiz(d)) n++; }
  return n*sign;
}
const fmt = s => s ? s.slice(8,10)+"/"+s.slice(5,7) : "—";
const fmtLong = s => s ? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : "—";
const esc = x => String(x ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money = x => x ? new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}).format(x) : "Não informado";
const isDate = s => !s || /^\d{4}-\d{2}-\d{2}$/.test(s);
const RET = () => (db.cfg && +db.cfg.returnDays) || 7;

function compute(c){
  c.due = c.next || (c.last ? addBiz(c.last, RET()) : TODAY);
  c.diff = bizBetween(TODAY, c.due);
  if(c.due < TODAY) c.state = ["bad","Atrasado"];
  else if(c.due === TODAY) c.state = ["warn","Hoje"];
  else c.state = ["info", c.diff === 1 ? "Em 1 dia útil" : "Em "+c.diff+" dias úteis"];
}
function refresh(){ db.clients.forEach(compute); }
const RANK = {green:0, yellow:1, red:2};
function color(c){
  if(c.calm && !c.alert) return "green";
  const byDate = c.due < TODAY ? "red" : (c.diff <= 1 ? "yellow" : "green");
  return (c.alert && RANK[c.alert] > RANK[byDate]) ? c.alert : byDate;
}
function completude(c){ const ks = [...FIELDS,"last","next","note"]; return Math.round(ks.filter(k=>c[k]).length/ks.length*100); }
function performance(){ return db.acts.length ? Math.min(99, 60 + Math.round(db.acts.filter(a=>a.result).length/db.acts.length*39)) : 60; }
function conv(){ const won = db.clients.filter(c=>c.s==="ganho").length, total = db.clients.length; return {won, total, pct: total ? Math.round(won/total*100) : 0}; }
function byId(id){ return db.clients.find(x=>x.id===id); }
function stateLine(c){
  const k = color(c);
  if(c.due < TODAY) return "Retorno atrasado em "+(-c.diff)+" dia(s) útil(eis) · "+c.p[1];
  if(c.due === TODAY) return "Retorno hoje · "+c.p[1];
  if(k==="yellow") return "Atenção média · "+c.p[1];
  return c.p[1];
}

let curMsg = "";

function toast(t){
  const el = document.getElementById("toast"); el.textContent = t; el.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("on"), 2200);
}
function copyText(t){
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly","");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
    ta.remove(); toast(ok ? "Copiado" : "Selecione o texto e copie manualmente");
  };
  try{ navigator.clipboard.writeText(t).then(()=>toast("Copiado"), fallback); }catch(e){ fallback(); }
}

      return `<section class="col" aria-labelledby="h-${s}">
        <div class="col-head"><h3 id="h-${s}">${st.name}</h3><span class="count" data-count="${s}"></span></div>

      </section>`;
    }).join("")}</div>`);

function filterPipe(){
  const q = (document.getElementById("q")?.value || "").toLowerCase();
  STAGES.forEach(st=>{
    const list = db.clients.filter(c=>c.s===st.id && c.n.toLowerCase().includes(q)).sort((a,b)=>a.due.localeCompare(b.due));
    const holder = document.querySelector(`[data-list="${st.id}"]`);
    const count = document.querySelector(`[data-count="${st.id}"]`);
    if(count) count.textContent = list.length;
    if(!holder) return;
    holder.innerHTML = list.length ? list.map(c=>{
      const k = color(c);
      return `<button class="env ${k}" onclick="openC(${c.id})" aria-label="${esc(c.n)}, ${COLOR_TXT[k]}">
        <span class="nm">${esc(c.n)}</span><span class="meta">${esc(c.p[1])} · próximo ${fmt(c.due)}</span></button>`;
    }).join("") : '<div class="empty">Nenhum cliente</div>';
  });
}

function drillStage(stage){
  const list = db.clients.filter(c=>c.s===stage);
  setApp(head(LABEL[stage], "Clientes nesta etapa do funil.", `<button class="btn" onclick="go('intel')">← Inteligência</button>`) +
    `<section class="card"><div class="tbl-wrap"><table><thead><tr><th>Cliente</th><th>Situação</th><th>Próximo contato</th><th>Próxima ação</th></tr></thead><tbody>

    </tbody></table></div></section>`);
}
function drilldown(kind){
  let title="", subtitle="", list=[], badge="";
  const all = db.clients;
  if(kind==="clientes"){ title="Carteira completa"; subtitle="Todos os clientes do pipe."; list=all; }
  else if(kind==="ganhos"){ title="Operação conquistada"; subtitle="Clientes em ganho. Identifique o que funciona e onde há expansão."; list=all.filter(c=>c.s==="ganho"); }
  else if(kind==="vencidos"){ title="Retornos vencidos ou hoje"; subtitle="Clientes cuja data de retorno chegou ou passou."; list=all.filter(c=>!c.calm && c.due<=TODAY); }
  else if(kind==="incompletas"){ title="Fichas incompletas"; subtitle="Clientes com completude abaixo de 70%."; list=all.filter(c=>completude(c)<70); badge="Completar ficha"; }
  else if(kind==="potencial"){ title="Potencial comercial"; subtitle="Clientes com potencial mensal informado."; list=all.filter(c=>(+c.potential||0)>0); badge="Potencial informado"; }
  else if(kind==="score"){ title="Score dos clientes"; subtitle="Do maior para o menor score."; list=[...all].sort((a,b)=>b.score-a.score); }
  else if(kind==="performance"){ title="Diagnóstico de performance"; subtitle="Veja quais clientes sustentam ou puxam a performance para baixo."; list=[...all].sort((a,b)=>(color(b)==="red")-(color(a)==="red") || b.score-a.score); }
  else if(kind==="margem"){ title="Saúde de custos e margem"; subtitle="A margem individual ainda não está preenchida. Estes clientes precisam de dados de custo antes de concluir a saúde financeira."; list=all.filter(c=>!(+c.revenue||0)||!(+c.potential||0)); badge="Dados de custo incompletos"; }
  else if(kind.startsWith("metric:")){
    const i = +kind.split(":")[1];
    const names = ["Prospecção","Conversão","Follow-up em dia","Relacionamento","Expansão","Qualidade das informações"];
    title = names[i]; subtitle = "Clientes que compõem este indicador.";
    if(i===0) list = all.filter(c=>c.s==="prospeccao");
    else if(i===1) list = all.filter(c=>c.s==="ganho");
    else if(i===2) list = all.filter(c=>color(c)!=="green");
    else if(i===3) list = all.filter(c=>c.s==="ganho" && color(c)==="green");
    else if(i===4) list = all.filter(c=>c.s==="ganho");
    else list = all.filter(c=>completude(c)<70);
  }
  const rows = list.map(c=>{ const k=color(c); return `<div class="row">
      <div class="grow"><b>${esc(c.n)}</b><span class="small muted">${LABEL[c.s]} · score ${c.score} · ${COLOR_TXT[k]}</span><span class="small">${esc(c.note)}</span></div>
      <button class="btn sm" onclick="openC(${c.id})">Abrir ficha</button></div>`; }).join("")
    || '<div class="empty">Nenhum cliente nesta visão.</div>';
  openModal(`<div class="mh"><div><h2>${esc(title)}</h2><div class="sub">${esc(subtitle)}</div></div><button class="close" onclick="closeModal()" aria-label="Fechar">✕</button></div>
    <div class="mb"><div class="callout"><b>${list.length} cliente(s)</b>${badge?esc(badge):"Toque em Abrir ficha para ver histórico, dados e ações."}</div><section class="card">${rows}</section></div>`);
}

function saveCfg(){

function confirmReset(btn){
  if(btn.dataset.armed === "1"){
    try{ localStorage.removeItem(KEY); }catch(e){}
    db = freshDb(); saveDb(); toast("Dados deste navegador limpos"); rerender();
  } else {
    btn.dataset.armed = "1"; btn.textContent = "Confirmar limpeza"; btn.style.borderColor = "var(--sal)"; btn.style.color = "var(--sal)";
    toast("Clique de novo para confirmar");

  }
}

          <div class="toolbar full"><button class="btn primary" type="submit">Salvar ficha</button><button class="btn" type="button" onclick="logAct(${id})">Registrar contato</button><button class="btn" type="button" onclick="reagendar(${id})">Reagendar</button><button class="btn" type="button" onclick="abrirEstrategia(${id})">Plano de abordagem</button></div>
        </div>
      </form>
    </div>
    <section class="card"><h3 style="margin-bottom:6px">Histórico e fontes</h3>
      <div class="hist-list">${hist.length ? hist.map(h=>`<div><span class="d">${fmtLong(h.d)}</span><span class="pill info" style="font-size:10px;margin-right:6px">${h.src}</span>${esc(h.t)}</div>`).join("") : '<div class="empty">Nenhuma atividade registrada.</div>'}</div>
    </section>
  </div>`);
}
function saveC(id){
  const c = byId(id); if(!c) return;
  const last = document.getElementById("f_last").value.trim();
  const next = document.getElementById("f_next").value.trim();
  if(!isDate(last) || !isDate(next)){ toast("Use datas válidas"); return; }
  c.s = document.getElementById("f_s").value;
  c.alert = document.getElementById("f_alert").value;
  FIELDS.forEach(f=>{ const v = document.getElementById("f_"+f).value.trim(); c[f] = f==="potential" ? (v ? (+v.replace(/\D/g,"") || null) : null) : v; });
  c.last = last; c.next = next; c.city = document.getElementById("f_city").value.trim();
  c.note = document.getElementById("f_note").value;
  c.meta = document.getElementById("f_meta").value;
  saveDb(); toast("Ficha salva");
  rerender(); openC(id);
}

/* ===================== Reagendar sem registrar contato ===================== */
function reagendar(id){
  const c = byId(id); if(!c) return;
  const defDate = c.due && c.due > TODAY ? c.due : addBiz(TODAY, 1);
  openModal(`<div class="mh"><div><h2>Reagendar retorno</h2><div class="sub">${esc(c.n)}</div></div><button class="close" onclick="closeModal()" aria-label="Fechar">✕</button></div>
    <div class="mb">
      <form class="form" onsubmit="event.preventDefault();saveReagendamento(${id})">
        <div class="callout info"><b>Nenhum contato será registrado.</b><br>Use esta opção somente para mudar a data do próximo retorno.</div>
        <div class="field"><label for="r_next">Nova data do retorno</label><input id="r_next" type="date" value="${defDate}" required></div>
        <div class="toolbar full"><button class="btn primary" type="submit">Salvar nova data</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div>
      </form>
    </div>`);
}
function saveReagendamento(id){
  const c = byId(id); if(!c) return;
  const next = document.getElementById("r_next").value;
  if(!isDate(next) || !next){ toast("Escolha uma data válida"); return; }
  c.next = next;
  saveDb(); closeModal(); toast("Retorno reagendado — nenhum contato foi registrado");
  rerender();
}

/* ===================== Registrar contato ===================== */
function logAct(id){
  const c = byId(id); if(!c) return;
  const defNext = addBiz(TODAY, RET());
  openModal(`<div class="mh"><div><h2>Registrar contato</h2><div class="sub">${esc(c.n)}</div></div><button class="close" onclick="closeModal()" aria-label="Fechar">✕</button></div>
    <div class="mb">
      <form class="form" onsubmit="event.preventDefault();saveAct(${id})">
        <div class="field"><label for="a_type">Tipo</label><select id="a_type">${CONTACT_TYPES.map(t=>`<option>${t}</option>`).join("")}</select></div>
        <div class="field"><label for="a_date">Data do contato</label><input id="a_date" type="date" value="${TODAY}"></div>
        <div class="field full"><label for="a_result">Resultado</label><input id="a_result" placeholder="Ex.: pediu revisão do tarifário" required></div>
        <div class="field full"><label for="a_notes">Observação</label><textarea id="a_notes" placeholder="O que foi dito, combinado ou objeção levantada"></textarea></div>
        <div class="field"><label for="a_next">Próximo contato</label><input id="a_next" type="date" value="${defNext}"></div>
        <div class="field" style="justify-content:flex-end"><span class="small muted">Padrão: ${RET()} dias úteis após o contato.</span></div>
        <div class="toolbar full"><button class="btn primary" type="submit">Salvar contato</button><button class="btn" type="button" onclick="openC(${id})">Cancelar</button></div>
      </form>
    </div>`);
}
function saveAct(id){
  const c = byId(id); if(!c) return;
  const type = document.getElementById("a_type").value;
  const date = document.getElementById("a_date").value || TODAY;
  const result = document.getElementById("a_result").value.trim();
  const notes = document.getElementById("a_notes").value.trim();
  const next = document.getElementById("a_next").value || addBiz(date, RET());
  if(!result){ toast("Informe o resultado do contato"); return; }
  db.acts.push({clientId:id, date, type, result, notes, next});
  c.last = date; c.next = next;
  saveDb(); toast("Contato registrado");
  rerender(); openC(id);
}

/* ===================== Central de atualizações / receptor ===================== */
function normalizarNomeCliente(v){
  return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
    .replace(/[^a-z0-9]+/g," ").trim().replace(/\s+/g," ");
}
function gerarIdUpdate(u, packageId, index){
  return String(u.id || u.update_id || `${packageId||"pacote"}-${index+1}`);
}
function clientePorNome(nome){
  const key = normalizarNomeCliente(nome);
  return db.clients.find(c=>normalizarNomeCliente(c.n)===key);
}
function preencherSeInformado(obj, target, key){
  const v = obj?.[key];
  if(v !== undefined && v !== null && String(v).trim() !== "") target[key] = v;
}
function mapTipoContato(v){
  if(!v) return "WhatsApp";
  const t = String(v).toLowerCase();
  if(t.includes("whats")) return "WhatsApp";
  if(t.includes("lig")) return "Ligação";
  if(t.includes("mail") || t.includes("email") || t.includes("e-mail")) return "E-mail";
  if(t.includes("reun")) return "Reunião";
  if(t.includes("visit")) return "Visita";
  return String(v);
}
function ensureHist(c, date, text){
  if(!text) return;
  c.hist = Array.isArray(c.hist) ? c.hist : [];
  c.hist.push([date || TODAY, text]);
}
function applyUpdate(u, packageId, index){
  const idu = gerarIdUpdate(u, packageId, index);
  if(db.importedUpdates.includes(idu)) return {status:"duplicada", nome:u.cliente||u.nome||"Sem nome"};
  const nome = String(u.cliente || u.nome || "").trim();
  if(!nome) return {status:"erro", nome:"Sem nome", detalhe:"Campo cliente obrigatório"};
  let c = clientePorNome(nome);
  const acao = String(u.acao || "atualizar").toLowerCase();
  const date = u.data || u.data_contato || TODAY;
  const isNew = !c;
  if(!c){
    const nextId = db.clients.reduce((m,x)=>Math.max(m,+x.id||0),0)+1;
    const base = u.cliente_data || u.dados_cliente || u;
    c = {
      id:nextId, n:nome, city:base.cidade||base.city||"", s:base.etapa||base.stage||"prospeccao",
      p:["info",base.situacao||"Em aberto"], alert:base.alerta||"", calm:false, est:false,
      score:Math.max(0,Math.min(100,+base.score||60)), tags:Array.isArray(base.tags)?base.tags:[],
      decision:base.decisor||base.decision||"", segment:base.segmento||base.segment||"",
      volume:base.volumetria||base.volume||"", revenue:base.faturamento||base.revenue||"",
      potential:base.potencial_mensal!=null ? +base.potencial_mensal : (base.potential!=null ? +base.potential : null),
      pain:base.dor||base.pain||"", competitor:base.concorrente||base.competitor||"",
      last:base.ultimo_contato||base.last||date||"", next:base.proximo_contato||base.next||"",
      note:base.contexto||base.situacao_detalhada||base.note||"", meta:base.detalhes_operacao||base.meta||"",
      how:base.abordagem||"Definir abordagem", act:base.proximo_passo||"Registrar o próximo movimento comercial e manter o retorno com data.",
      hist:[]
    };
    db.clients.push(c);
  }
  const base = u.cliente_data || u.dados_cliente || u;
  const fieldMap = {
    cidade:["cidade","city"], etapa:["etapa","stage"], decisor:["decisor","decision"], segmento:["segmento","segment"],
    volumetria:["volumetria","volume"], faturamento:["faturamento","revenue"], dor:["dor","pain"],
    concorrente:["concorrente","competitor"], contexto:["contexto","note"], detalhes_operacao:["detalhes_operacao","meta"],
    abordagem:["abordagem","how"], proximo_passo:["proximo_passo","act"]
  };
  Object.entries(fieldMap).forEach(([dest, keys])=>{
    for(const key of keys){ if(base[key]!==undefined && base[key]!==null && String(base[key]).trim()!==""){ c[dest==="cidade"?"city":dest==="etapa"?"s":dest==="decisor"?"decision":dest==="segmento"?"segment":dest==="volumetria"?"volume":dest==="faturamento"?"revenue":dest==="dor"?"pain":dest==="concorrente"?"competitor":dest==="contexto"?"note":dest==="detalhes_operacao"?"meta":dest==="abordagem"?"how":dest==="proximo_passo"?"act":dest]=base[key]; break; }
    }
  });
  if(base.pill || base.situacao){
    c.p = Array.isArray(base.p) ? base.p : ["info", base.pill || base.situacao];
  }
  if(base.score!==undefined && base.score!==null && base.score!=="") c.score=Math.max(0,Math.min(100,+base.score||0));
  if(base.potencial_mensal!==undefined && base.potencial_mensal!==null && base.potencial_mensal!=="") c.potential=+String(base.potencial_mensal).replace(/\D/g,"")||null;
  if(base.ultimo_contato || base.last) c.last=base.ultimo_contato||base.last;
  if(base.proximo_contato || base.next) c.next=base.proximo_contato||base.next;

  const resultado = String(u.resultado || u.result || "").trim();
  const observacao = String(u.observacao || u.obs || u.notas || "").trim();
  const tipo = mapTipoContato(u.tipo_contato || u.tipo || u.contact_type);
  const registrouContato = u.registrar_contato !== false && (!!resultado || !!observacao || !!u.tipo_contato || !!u.tipo);
  if(registrouContato){
    const act = {clientId:c.id, date, type:tipo, result:resultado || "Atualização comercial registrada via pacote.", notes:observacao, next:u.proximo_contato||u.next||c.next||""};
    db.acts.push(act);
    c.last=date;
    if(u.proximo_contato || u.next) c.next=u.proximo_contato||u.next;
    ensureHist(c,date,`${tipo} · ${resultado || "Atualização comercial registrada."}${observacao ? " — "+observacao : ""}`);
  } else if(observacao || resultado){
    ensureHist(c,date,[resultado,observacao].filter(Boolean).join(" — "));
  }
  if(u.proximo_contato || u.next) c.next=u.proximo_contato||u.next;
  if(u.est!==undefined) c.est=!!u.est;
  if(Array.isArray(u.tags)) c.tags=u.tags;
  if(u.alerta!==undefined) c.alert=u.alerta;
  db.importedUpdates.push(idu);
  return {status:isNew || acao==="criar" ? "criado" : "atualizado", nome:c.n, id:c.id};
}
function importarPacote(raw){
  let pkg;
  try{ pkg = typeof raw==="string" ? JSON.parse(raw) : raw; }catch(e){ throw new Error("JSON inválido"); }
  if(!pkg || !Array.isArray(pkg.atualizacoes)) throw new Error("O arquivo precisa conter uma lista 'atualizacoes'.");
  const packageId = String(pkg.package_id || pkg.pacote_id || `BGH-${Date.now()}`);
  if(db.importedPackages.includes(packageId)) return {duplicado:true, packageId};
  const result={criados:0, atualizados:0, duplicados:0, erros:0, detalhes:[]};
  pkg.atualizacoes.forEach((u,i)=>{
    try{
      const r=applyUpdate(u,packageId,i);
      result.detalhes.push(r);
      if(r.status==="criado") result.criados++;
      else if(r.status==="atualizado") result.atualizados++;
      else if(r.status==="duplicada") result.duplicados++;
      else result.erros++;
    }catch(e){ result.erros++; result.detalhes.push({status:"erro",nome:u?.cliente||"Sem nome",detalhe:e.message}); }
  });
  db.importedPackages.push(packageId);
  saveDb(); refresh();
  return {...result,packageId};
}
function abrirImportador(){
  openModal(`<div class="mh"><div><h2>Importar pacote de atualizações</h2><div class="sub">Receba um arquivo preparado a partir das informações que você me passou durante o dia.</div></div><button class="close" onclick="closeModal()" aria-label="Fechar">✕</button></div>
  <div class="mb">
    <div class="callout info"><b>Como funciona</b><br>O pacote pode trazer várias atualizações do mesmo cliente. O Hub identifica o cliente pelo nome, atualiza o card existente ou cria um novo card quando ele ainda não existe. O mesmo pacote não é importado duas vezes.</div>
    <div class="field"><label for="pkgFile">Arquivo do pacote (.json)</label><input id="pkgFile" type="file" accept=".json,application/json"></div>
    <div class="field full"><label for="pkgText">Ou cole o JSON</label><textarea id="pkgText" style="min-height:170px;font-family:var(--mono);font-size:12px" placeholder='{"package_id":"BGH-20261008-1730","atualizacoes":[...]}'></textarea></div>
    <div id="pkgPreview" class="small muted">Nenhum pacote carregado.</div>
    <div class="toolbar"><button class="btn primary" onclick="processarPacote()">Importar atualizações</button><button class="btn" onclick="closeModal()">Cancelar</button></div>
  </div>`);
  const f=document.getElementById("pkgFile");
  f.addEventListener("change",()=>{
    const file=f.files?.[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{ document.getElementById("pkgText").value=reader.result; atualizarPreviewPacote(); };
    reader.readAsText(file);
  });
  document.getElementById("pkgText").addEventListener("input",atualizarPreviewPacote);
}
function atualizarPreviewPacote(){
  const txt=document.getElementById("pkgText")?.value.trim();
  const el=document.getElementById("pkgPreview"); if(!el) return;
  if(!txt){el.textContent="Nenhum pacote carregado.";return;}
  try{
    const p=JSON.parse(txt);
    const n=Array.isArray(p.atualizacoes)?p.atualizacoes.length:0;
    const nomes=[...new Set((p.atualizacoes||[]).map(x=>x.cliente||x.nome).filter(Boolean))];
    el.innerHTML=`<span class="pill good">${n} atualização(ões)</span> · ${nomes.length} cliente(s): ${esc(nomes.join(", "))}`;
  }catch(e){ el.innerHTML='<span class="pill bad">JSON inválido</span>'; }
}
function processarPacote(){
  const txt=document.getElementById("pkgText")?.value.trim();
  if(!txt){toast("Selecione um arquivo ou cole o JSON");return;}
  try{
    const r=importarPacote(txt);
    if(r.duplicado){ toast("Esse pacote já foi importado"); return; }
    closeModal();
    toast(`Importado: ${r.criados} novo(s) · ${r.atualizados} atualizado(s)`);
    rerender();
    setTimeout(()=>mostrarResumoImportacao(r),120);
  }catch(e){ toast(e.message); }
}
function mostrarResumoImportacao(r){
  openModal(`<div class="mh"><div><h2>Pacote importado</h2><div class="sub">${esc(r.packageId)}</div></div><button class="close" onclick="closeModal()" aria-label="Fechar">✕</button></div>
  <div class="mb">
    <div class="stats"><div><b>${r.criados}</b><span>Novos clientes</span></div><div><b>${r.atualizados}</b><span>Clientes atualizados</span></div><div><b>${r.duplicados}</b><span>Ignorados por duplicidade</span></div></div>
    <section class="card"><h3>Detalhamento</h3><div class="hist-list">${r.detalhes.map(d=>`<div><span class="pill ${d.status==="erro"?"bad":d.status==="criado"?"good":"info"}">${esc(d.status)}</span> ${esc(d.nome)}${d.detalhe?` — ${esc(d.detalhe)}`:""}</div>`).join("")}</div></section>
    <div class="toolbar"><button class="btn primary" onclick="closeModal()">Fechar</button></div>
  </div>`);
}
function updates(){
  const imported = [...db.importedPackages].reverse().slice(0,12);
  setApp(head("Central de atualizações","Receptor dos pacotes que eu preparo a partir das suas demandas do dia.",
    `<button class="btn primary" onclick="abrirImportador()">📥 Importar pacote</button>`) +
    `<section class="card hero" style="margin-bottom:16px"><div><div class="eyebrow">Fluxo recomendado</div><h2>Você me passa as demandas. O Hub recebe o lote.</h2><p>Durante o dia, várias atualizações do mesmo cliente podem ser acumuladas. No fechamento, um único pacote pode criar novos cards e atualizar os existentes.</p></div></section>
    <div class="two-col">
      <section class="card"><h3>O que o receptor faz</h3>
        <div class="row"><span class="rank">1</span><span>Identifica o cliente pelo nome normalizado.</span></div>
        <div class="row"><span class="rank">2</span><span>Se já existe, atualiza o mesmo card.</span></div>
        <div class="row"><span class="rank">3</span><span>Se não existe, cria um novo card.</span></div>
        <div class="row"><span class="rank">4</span><span>Acumula histórico e contatos em sequência.</span></div>
        <div class="row"><span class="rank">5</span><span>Impede importar o mesmo pacote duas vezes.</span></div>
      </section>
      <section class="card"><h3>Últimos pacotes</h3>
        ${imported.length ? imported.map(x=>`<div class="row"><span class="pill info">${esc(x)}</span><span class="small muted">Importado neste navegador</span></div>`).join("") : '<div class="empty">Nenhum pacote importado ainda.</div>'}
      </section>
    </div>
    <section class="card"><h3>Formato aceito</h3>
      <p class="small">O arquivo usa JSON. Você não precisa editar o conteúdo. Ele pode conter várias linhas para o mesmo cliente e cada atualização é aplicada na ordem em que aparece no pacote.</p>
      <pre style="white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:10px;overflow:auto;font-size:12px">${esc(JSON.stringify({package_id:"BGH-20261008-1730",atualizacoes:[{id:"LBS-20261008-01",cliente:"LBS COMERCIAL",acao:"atualizar",data:"2026-10-08",tipo_contato:"WhatsApp",resultado:"Volumetria solicitada",observacao:"Aguardar planilha dos últimos 3 meses.",proximo_contato:"2026-10-20"},{id:"ABC-20261008-01",cliente:"ABC DISTRIBUIDORA",acao:"criar",data:"2026-10-08",tipo_contato:"Ligação",resultado:"Primeiro contato realizado",observacao:"Carlos é responsável pela logística.",proximo_contato:"2026-10-15",cliente_data:{cidade:"Belo Horizonte/MG",etapa:"prospeccao",score:60,segmento:"Distribuidora",volumetria:"500 NF/mês"}}]},null,2))}</pre>
    </section>
  </div>`);
}

/* ===================== Backup (copiar e restaurar) ===================== */
document.getElementById("btnImport").onclick = abrirImportador;
document.getElementById("btnCopy").onclick = ()=> copyText(JSON.stringify(db));
document.getElementById("btnRestore").onclick = ()=>{
  openModal(`<div class="mh"><div><h2>Restaurar backup</h2><div class="sub">Cole o JSON copiado em “Copiar backup”. Os dados atuais deste navegador são substituídos.</div></div><button class="close" onclick="closeModal()" aria-label="Fechar">✕</button></div>
    <div class="mb"><div class="field"><label for="bk">JSON do backup</label><textarea id="bk" style="min-height:180px;font-family:var(--mono);font-size:12px"></textarea></div>
    <div class="toolbar"><button class="btn primary" onclick="restoreBackup()">Restaurar</button><button class="btn" onclick="closeModal()">Cancelar</button></div></div>`);
};
function restoreBackup(){
  const raw = document.getElementById("bk").value.trim();
  try{
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.clients) || !d.cfg) throw new Error("formato");
    db = d; saveDb(); closeModal(); toast("Backup restaurado"); rerender();
  }catch(e){ toast("Não consegui ler esse backup"); }
}

/* ===================== Início ===================== */
go("home");
</script>
